<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>视角挑战 · 第三关（重写版）</title>
<style>
:root{
 --ink:#1b2447;--grass:#4fae47;--coin:#ffd23e;--coinD:#e0a41f;
 --red:#e5453c;--purple:#8b5fbf;--panel:#fffbe8;--panel2:#f4e8c8;--blue:#3f6fb5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{background:linear-gradient(#a8dcf7,#7ec8f0 55%,#c8ecff);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);
 display:flex;flex-direction:column;align-items:center;padding:16px 14px 28px;min-height:100dvh;position:relative}

.head{text-align:center;margin-bottom:12px}
.chip{display:inline-block;background:var(--panel);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:4px 12px;font-weight:900;font-size:13px;margin-bottom:6px}
.ttl{font-size:22px;font-weight:900;margin:0;text-shadow:1px 1px 0 #fff}
.sub{font-size:13px;font-weight:700;color:#3a4a6b;margin-top:4px}

.stage{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;align-items:flex-start;width:100%;max-width:960px}

/* ---- 取景框 ---- */
.vf-col{display:flex;flex-direction:column;align-items:center;gap:10px;flex:0 0 auto}
.viewfinder{position:relative;width:min(70vw,520px);aspect-ratio:3/4;background:#000;border:6px solid var(--ink);
 box-shadow:6px 6px 0 rgba(27,36,71,.85);overflow:hidden}
.vf-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s ease;z-index:2}
.vf-photo.active{opacity:1}
.vf-fallback{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;opacity:0;transition:opacity .45s ease}
.vf-fallback.active{opacity:1;z-index:3}
.vf-fallback b{font-size:22px;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.5)}
.vf-fallback span{font-size:12px;color:#fff;opacity:.85}
.fb-level{background:linear-gradient(160deg,#3f6fb5,#7ec8f0)}
.fb-low{background:linear-gradient(160deg,#4fae47,#bfe6a6)}
.fb-high{background:linear-gradient(160deg,#8b5fbf,#d6bdf2)}
.vf-corner{position:absolute;width:22px;height:22px;border-color:#fff;z-index:4;opacity:.85;pointer-events:none}
.vf-corner.tl{top:8px;left:8px;border-top:3px solid #fff;border-left:3px solid #fff}
.vf-corner.tr{top:8px;right:8px;border-top:3px solid #fff;border-right:3px solid #fff}
.vf-corner.bl{bottom:8px;left:8px;border-bottom:3px solid #fff;border-left:3px solid #fff}
.vf-corner.br{bottom:8px;right:8px;border-bottom:3px solid #fff;border-right:3px solid #fff}
.vf-badge{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:5;background:rgba(27,36,71,.78);color:var(--coin);
 font-weight:900;font-size:13px;padding:4px 12px;border:2px solid var(--coin);white-space:nowrap}
.vf-mode{margin-top:2px;font-size:12px;font-weight:700;color:#3a4a6b;text-align:center}

/* ---- 控制区 ---- */
.ctl-col{display:flex;flex-direction:column;gap:10px;width:min(70vw,320px);flex:0 0 auto}
.btn{min-height:54px;border:4px solid var(--ink);border-radius:0;padding:8px 14px;font-size:14px;font-weight:900;font-family:inherit;color:var(--ink);
 background:var(--coin);cursor:pointer;text-align:left;line-height:1.3;
 box-shadow:inset 0 4px 0 rgba(255,255,255,.26),inset -4px 0 0 rgba(0,0,0,.14),inset 0 -6px 0 rgba(0,0,0,.22),0 6px 0 rgba(27,36,71,.8)}
.btn:active{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,255,255,.2),inset 0 -4px 0 rgba(0,0,0,.2),0 2px 0 rgba(27,36,71,.8)}
.btn small{display:block;font-weight:700;font-size:11px;opacity:.75;margin-top:2px}
.btn.sel{background:var(--red);color:#fff}
.btn-perm{background:var(--blue);color:#fff}
.btn-ghost{background:var(--panel);font-size:12px;min-height:38px}
.btn-calib{background:var(--purple);color:#fff}
.btn-calib.pulse{animation:pulseGlow 1s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{box-shadow:inset 0 4px 0 rgba(255,255,255,.26),inset -4px 0 0 rgba(0,0,0,.14),inset 0 -6px 0 rgba(0,0,0,.22),0 6px 0 rgba(27,36,71,.8)}50%{box-shadow:inset 0 4px 0 rgba(255,255,255,.4),inset -4px 0 0 rgba(0,0,0,.1),inset 0 -6px 0 rgba(0,0,0,.16),0 6px 0 rgba(27,36,71,.8),0 0 0 4px rgba(139,95,191,.35)}}

.dim{font-size:12px;font-weight:700;color:#3a4a6b}
.debug{background:var(--panel);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--27,36,71,.7);box-shadow:3px 3px 0 rgba(27,36,71,.7);padding:8px 10px;font-size:11px;font-weight:700;color:#3a4a6b;white-space:pre-line;font-family:"SF Mono",Menlo,Consolas,monospace}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--coin);border:3px solid var(--coin);
 box-shadow:4px 4px 0 rgba(0,0,0,.4);padding:10px 20px;font-weight:900;font-size:14px;opacity:0;transition:.25s;z-index:92;pointer-events:none;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ---- 校准遮罩：进入页面 / 点"重新校准"时出现 ---- */
.calib-layer{position:fixed;inset:0;z-index:80;background:rgba(15,20,40,.82);display:flex;align-items:center;justify-content:center;padding:20px}
.calib-layer.hidden{display:none}
.calib-box{background:var(--panel);border:5px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.5);padding:26px 24px;max-width:360px;width:100%;text-align:center}
.calib-icon{font-size:40px;margin-bottom:8px}
.calib-title{font-weight:900;font-size:18px;margin-bottom:6px}
.calib-sub{font-size:13px;font-weight:700;color:#3a4a6b;margin-bottom:16px}
.calib-track{height:16px;border:3px solid var(--ink);background:#fff;overflow:hidden}
.calib-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--coin),var(--coinD));transition:width .08s linear}
.calib-tip{margin-top:10px;font-size:11px;color:#5c6b8c;font-weight:700}
</style>
</head>
<body>

<div class="head">
 <div class="chip">视角挑战 · 第三关（重写版）</div>
 <h1 class="ttl">转动平板，找到对应的拍摄视角</h1>
 <div class="sub">把平板当相机端起来，倾斜镜头方向，看取景框里的照片会不会跟着换</div>
</div>

<div class="stage">
 <div class="vf-col">
  <div class="viewfinder" id="viewfinder">
   <div class="vf-corner tl"></div><div class="vf-corner tr"></div>
   <div class="vf-corner bl"></div><div class="vf-corner br"></div>
   <div class="vf-badge" id="vfBadge">平拍</div>

   <img class="vf-photo" id="photoLevel" data-idx="0" src="photos/angle-level.jpg" alt="" onerror="this.style.display='none'">
   <img class="vf-photo" id="photoLow"   data-idx="1" src="photos/angle-low.jpg"   alt="" onerror="this.style.display='none'">
   <img class="vf-photo" id="photoHigh"  data-idx="2" src="photos/angle-high.jpg"  alt="" onerror="this.style.display='none'">

   <div class="vf-fallback fb-level active" data-idx="0"><b>平拍参考图</b><span>镜头与对象齐平</span></div>
   <div class="vf-fallback fb-low" data-idx="1"><b>仰拍参考图</b><span>镜头朝上，拍向天空方向</span></div>
   <div class="vf-fallback fb-high" data-idx="2"><b>俯拍参考图</b><span>镜头朝下，拍向地面方向</span></div>
  </div>
  <div class="vf-mode" id="vfMode">正在检测体感传感器…</div>
 </div>

 <div class="ctl-col">
  <button class="btn btn-perm" id="btnPerm" style="display:none">开启体感识别</button>
  <button class="btn btn-calib" id="btnCalibrate" style="display:none">🎯 重新校准平视角度<small>把平板端平、镜头对准前方后点这里</small></button>

  <button class="btn sel" data-idx="0">
   平拍<small>镜头与对象齐平</small>
  </button>
  <button class="btn" data-idx="1">
   仰拍<small>镜头朝上，拍向天空方向</small>
  </button>
  <button class="btn" data-idx="2">
   俯拍<small>镜头朝下，拍向地面方向</small>
  </button>

  <button class="btn btn-ghost" id="btnAuto" style="display:none">↺ 恢复自动体感识别</button>

  <div class="debug" id="debug">调试信息加载中…</div>
 </div>
</div>

<div class="toast" id="toast"></div>

<!-- 校准遮罩层：进入页面自动出现一次，之后可通过"重新校准"按钮再次呼出 -->
<div class="calib-layer" id="calibLayer">
 <div class="calib-box">
  <div class="calib-icon">📐</div>
  <div class="calib-title">请将平板保持水平</div>
  <div class="calib-sub" id="calibSub">端平、镜头对准正前方，保持不动约1秒…</div>
  <div class="calib-track"><div class="calib-fill" id="calibFill"></div></div>
  <div class="calib-tip" id="calibTip">正在等待传感器数据…</div>
 </div>
</div>

<script>
/* ============================================================
   一、集中配置区——上机实测时只改这里的数字/开关，不用动下面逻辑
   ============================================================ */
var ORIENTATION_CONFIG = {
 flatThreshold: 12,         // "平拍"死区半径（度）：相对基准 |Δ| ≤ 此值算平拍（建议 10~15）
 hysteresis: 4,             // 迟滞带：离开平拍要 |Δ| > 12+4=16°，回到平拍只需 |Δ| < 12-4=8°
 switchDelay: 400,          // 新姿态需连续保持多久才真正切换（毫秒，建议 300~500）
 calibrationDuration: 1000, // 校准时保持水平的采样时长（毫秒）
 minCalibSamples: 8,        // 校准至少要采到多少个样本（防止传感器晚启动时基准失真）
 smoothing: 0.3,            // 低通平滑系数 0~1：越大越跟手但越易抖，越小越稳但越迟钝
 invertDirection: false     // 实测若"仰拍/俯拍"整体相反 → 只把这里改成 true，其它都不用动
};

/* ============================================================
   二、状态变量（照片切换、手动/自动、页面流程等原有功能全部保留）
   ============================================================ */
var $ = function(s){return document.querySelector(s)};
var photos = [$('#photoLevel'), $('#photoLow'), $('#photoHigh')];
var fallbacks = document.querySelectorAll('.vf-fallback');
var manualBtns = document.querySelectorAll('.ctl-col .btn[data-idx]');
var badge = $('#vfBadge'), modeEl = $('#vfMode'), debugEl = $('#debug');
var btnCalibrate = $('#btnCalibrate'), btnAuto = $('#btnAuto'), btnPerm = $('#btnPerm');
var calibLayer = $('#calibLayer'), calibFill = $('#calibFill'), calibTip = $('#calibTip'), calibSub = $('#calibSub');
var names = ['平拍','仰拍','俯拍'];

var sensorSupported = ('DeviceOrientationEvent' in window);
var mode = 'auto';          // 'auto' | 'manual'
var current = 0;            // 0平拍 / 1仰拍 / 2俯拍
var sensorActive = false;
var smoothedAngle = null;   // 平滑后的"镜头俯仰角"：+ 朝天 / 0 水平 / - 朝地
var baseline = null;        // 校准得到的 BASELINE
var calibrating = false;
var calibBuf = [];
var calibStartTs = null;    // 收到第一个有效样本才开始计时
var pendingIdx = null;      // 正在等待稳定确认的候选状态
var pendingSince = 0;
var lastRaw = {alpha:null, beta:null, gamma:null, screenAngle:0, oriWord:'--'};

function showToast(msg){
 var t = $('#toast');
 t.textContent = msg;
 t.classList.add('on');
 clearTimeout(showToast._tm);
 showToast._tm = setTimeout(function(){ t.classList.remove('on') }, 2200);
}

function setActive(idx){
 current = idx;
 photos.forEach(function(p){ p.classList.toggle('active', +p.dataset.idx === idx) });
 fallbacks.forEach(function(f){ f.classList.toggle('active', +f.dataset.idx === idx) });
 badge.textContent = names[idx];
 manualBtns.forEach(function(b){ b.classList.toggle('sel', +b.dataset.idx === idx) });
}

/* ============================================================
   三、镜头俯仰角计算（本次修复的核心）
   ------------------------------------------------------------
   【旧方案为什么错】
   DeviceOrientation 的 beta/gamma 是相对"设备物理外壳"定义的，
   横屏/竖屏、正握/反握时，同一个"镜头朝天"动作落在完全不同的
   轴和符号上。更致命的是：横屏端平持机时设备恰好停在
   gamma = ±90° 的取值边界，镜头一越过水平线，浏览器上报的
   (alpha, beta, gamma) 会整体跳变（beta 从 0 跳到 ±180°，
   gamma 从 +90° 一侧跳到 -90° 一侧）。因此任何"挑一个轴、
   比正负号"的算法，在横屏下朝天/朝地两个方向都会算出同号的
   结果——"朝天被判成俯拍"的根源就在这里。

   【现在的做法：不挑轴，直接算物理量】
   后置镜头的方向 = 屏幕法线（设备 Z 轴）的反方向，它与水平面
   的夹角存在只由 beta、gamma 决定的闭式解：

        pitch = -asin( cosβ · cosγ )      单位：度

   - pitch > 0：镜头朝天（仰拍方向）
   - pitch < 0：镜头朝地（俯拍方向）
   - pitch ≈ 0：端平持机（平拍）

   用已知姿态验证：平放桌面屏幕朝上 → β=0,γ=0 → pitch=-90°
   （镜头垂直朝地）✓；竖屏端平 → β=90° → pitch=0° ✓；
   横屏端平 → γ=±90° → pitch=0° ✓；横屏镜头朝天 → β≈±180°,
   γ 在跳变区 → pitch=+90° ✓。该值与 alpha 无关、与横竖屏无关、
   与左右手持法无关、与浏览器在 ±90° 边界处的数值跳变无关，
   还对"绕镜头轴转动（握持内八/外八）"天然免疫。
   ============================================================ */
function lensPitch(beta, gamma){
 var rad = Math.PI / 180;
 var c = Math.cos(beta * rad) * Math.cos(gamma * rad);
 c = Math.max(-1, Math.min(1, c));   // 浮点保护，防止 asin 参数略超 ±1 得 NaN
 return -Math.asin(c) / rad;
}

/* 屏幕旋转角度：只用于调试面板显示，姿态判断完全不依赖它。
   （老版本 iPad Safari 的 window.orientation 有一直返回 0 的已知
   问题，screen.orientation 又要 Safari 16.4 才支持——一切"按屏幕
   角度挑轴"的方案在教室 iPad 上都不可靠，这正是本版放弃挑轴、
   改用上面物理公式的原因。） */
function getScreenAngle(){
 if(screen.orientation && typeof screen.orientation.angle === 'number'){
  return screen.orientation.angle;
 }
 if(typeof window.orientation === 'number') return window.orientation;
 return 0;
}
function oriWord(){
 try{
  if(window.matchMedia) return window.matchMedia('(orientation: landscape)').matches ? '横屏' : '竖屏';
 }catch(err){}
 return '--';
}

/* ============================================================
   四、校准流程（进入页面自动出现一次，也可随时重新校准）
   在 calibrationDuration 时间窗内对"镜头俯仰角"持续采样取平均，
   作为 BASELINE。之后所有判断只看相对 BASELINE 的变化量 Δ，
   不使用设备绝对角度——不同设备、不同持机习惯下"端平"读数
   不一样也没关系。
   ============================================================ */
function beginCalibration(){
 calibrating = true;
 calibBuf = [];
 calibStartTs = null;   // 关键：收到第一个有效样本才开始计 1 秒
 calibLayer.classList.remove('hidden');
 calibFill.style.width = '0%';
 calibTip.textContent = sensorActive ? '正在采集姿态数据…' : '正在等待传感器数据…';
 btnCalibrate.classList.remove('pulse');
 clearTimeout(beginCalibration._wd);
 beginCalibration._wd = setTimeout(function(){ // 保险：传感器断流时不卡死在全屏遮罩上
  if(calibrating && calibBuf.length === 0){
   calibrating = false;
   calibLayer.classList.add('hidden');
   showToast('没有收到传感器数据，校准已取消');
  }
 }, 3000);
}

function finishCalibration(){
 clearTimeout(beginCalibration._wd);
 var sum = 0;
 for(var i = 0; i < calibBuf.length; i++) sum += calibBuf[i];
 baseline = calibBuf.length ? sum / calibBuf.length : 0;
 calibrating = false;
 pendingIdx = null;
 mode = 'auto';
 btnAuto.style.display = 'none';
 setActive(0); // 校准完成的这一刻，认定为"平拍"
 calibLayer.classList.add('hidden');
 modeEl.textContent = '自动体感识别中（可随时点击"重新校准平视角度"）';
 showToast('校准完成！当前角度已设为平拍基准');
}

function ensureCalibration(){
 if(!calibrating && baseline === null && mode === 'auto') beginCalibration();
}

/* ============================================================
   五、主判断逻辑：迟滞死区 + 持续时间确认
   - 平拍 → 仰拍/俯拍：|Δ| 越过 flatThreshold + hysteresis（默认16°）
   - 仰拍/俯拍 → 平拍：|Δ| 回落到 flatThreshold - hysteresis（默认8°）以内
   - 任何切换意图都要连续保持 switchDelay 毫秒（60Hz 下约 24 帧）才生效，
     单帧抖动、临界角附近的来回晃动都不会让画面闪烁；
     仰拍↔俯拍之间必须经过平拍，快速甩动不会乱跳
   ============================================================ */
function judge(delta){
 var enter = ORIENTATION_CONFIG.flatThreshold + ORIENTATION_CONFIG.hysteresis;
 var exit  = Math.max(0, ORIENTATION_CONFIG.flatThreshold - ORIENTATION_CONFIG.hysteresis);
 var wantIdx = current;

 if(current === 0){
  if(delta >  enter) wantIdx = 1;
  else if(delta < -enter) wantIdx = 2;
 } else if(current === 1){
  if(delta < exit) wantIdx = 0;
 } else if(current === 2){
  if(delta > -exit) wantIdx = 0;
 }

 if(wantIdx === current){
  pendingIdx = null;
 } else if(wantIdx !== pendingIdx){
  pendingIdx = wantIdx;
  pendingSince = Date.now();
 } else if(Date.now() - pendingSince >= ORIENTATION_CONFIG.switchDelay){
  setActive(wantIdx);
  pendingIdx = null;
 }
}

/* ============================================================
   六、传感器事件处理 + 调试面板
   ============================================================ */
function onOrientation(e){
 if(e.beta === null || e.beta === undefined || e.gamma === null || e.gamma === undefined) return;
 sensorActive = true;
 btnPerm.style.display = 'none';
 btnCalibrate.style.display = 'block';

 var pitch = lensPitch(e.beta, e.gamma); // ← 核心改变：算镜头俯仰角，不再挑轴比正负
 smoothedAngle = (smoothedAngle === null)
   ? pitch
   : smoothedAngle + ORIENTATION_CONFIG.smoothing * (pitch - smoothedAngle);
 lastRaw = {alpha: e.alpha, beta: e.beta, gamma: e.gamma,
            screenAngle: getScreenAngle(), oriWord: oriWord()};

 ensureCalibration(); // 传感器数据来得晚/曾断流：自动补一次校准

 if(calibrating){
  if(calibStartTs === null) calibStartTs = Date.now();
  calibBuf.push(smoothedAngle);
  var elapsed = Date.now() - calibStartTs;
  var pct = Math.min(100, (elapsed / ORIENTATION_CONFIG.calibrationDuration) * 100);
  calibFill.style.width = pct + '%';
  var timeUp = elapsed >= ORIENTATION_CONFIG.calibrationDuration;
  var enough = calibBuf.length >= ORIENTATION_CONFIG.minCalibSamples;
  calibTip.textContent = (timeUp && !enough) ? '传感器数据较少，请再保持一下…' : '保持平稳… ' + Math.round(pct) + '%';
  if((timeUp && enough) || elapsed >= ORIENTATION_CONFIG.calibrationDuration * 2){
   finishCalibration();
  } else {
   renderDebug(null);
   return;
  }
 }

 if(baseline === null){
  renderDebug(null);
  return;
 }

 var delta = (smoothedAngle - baseline) * (ORIENTATION_CONFIG.invertDirection ? -1 : 1);
 renderDebug(delta);

 if(mode !== 'auto') return; // 手动模式下只刷新调试数据，不切照片
 judge(delta);
}

function renderDebug(delta){
 var enter = ORIENTATION_CONFIG.flatThreshold + ORIENTATION_CONFIG.hysteresis;
 var lines = [
  '姿态数据  α ' + fmt(lastRaw.alpha) + '°   β ' + fmt(lastRaw.beta) + '°   γ ' + fmt(lastRaw.gamma) + '°',
  '屏幕旋转 ' + lastRaw.screenAngle + '°（' + lastRaw.oriWord + '，仅调试显示，判断不依赖它）',
  '镜头俯仰 ' + fmt(smoothedAngle) + '°    BASELINE ' + (baseline === null ? '--' : fmt(baseline)) + '°'
 ];
 if(delta === null){
  lines.push('相对基准 --°（' + (calibrating ? '校准采样中…' : '等待校准') + '）');
 } else {
  lines.push('相对基准 ' + fmt(delta) + '°    判定区间：仰拍 > +' + enter + '°，俯拍 < -' + enter + '°');
 }
 var status = '当前姿态：' + names[current] + '（' + (mode === 'auto' ? '自动' : '手动') + '）';
 if(pendingIdx !== null){
  var left = Math.max(0, ORIENTATION_CONFIG.switchDelay - (Date.now() - pendingSince));
  status += '    确认中 → ' + names[pendingIdx] + '（剩 ' + (left / 1000).toFixed(1) + ' 秒）';
 }
 lines.push(status);
 debugEl.textContent = lines.join('\n');
}
function fmt(n){ return (n === null || n === undefined) ? '--' : n.toFixed(1) }

/* ============================================================
   七、手动按钮 / 恢复自动 / 重新校准（原有交互全部保留）
   ============================================================ */
manualBtns.forEach(function(b){
 b.addEventListener('click', function(){
  mode = 'manual';
  setActive(+b.dataset.idx);
  btnAuto.style.display = sensorSupported ? 'block' : 'none';
  modeEl.textContent = '手动模式（点击"恢复自动体感识别"可切回传感器）';
 });
});
btnAuto.addEventListener('click', function(){
 mode = 'auto';
 btnAuto.style.display = 'none';
 modeEl.textContent = sensorActive ? '自动体感识别中（可随时点击"重新校准平视角度"）' : '正在等待传感器数据…';
 ensureCalibration();
});
btnCalibrate.addEventListener('click', beginCalibration);

/* ============================================================
   八、启动 / 权限申请（iOS 13+ 需要用户点击后才能申请）
   ============================================================ */
function startListening(){
 window.addEventListener('deviceorientation', onOrientation, true);
 beginCalibration();
 setTimeout(function(){
  if(!sensorActive){
   calibrating = false;
   clearTimeout(beginCalibration._wd);
   calibLayer.classList.add('hidden');
   modeEl.textContent = '未检测到传感器数据，已切换为按钮模式';
   btnAuto.style.display = 'none';
   btnCalibrate.style.display = 'none';
   showToast('这台设备/浏览器没有返回方向数据，请用下方按钮手动切换');
  }
 }, 2500);
}

function initSensor(){
 if(!sensorSupported){
  calibLayer.classList.add('hidden');
  modeEl.textContent = '此设备不支持方向传感器，请使用下方按钮';
  return;
 }
 if(typeof DeviceOrientationEvent.requestPermission === 'function'){
  calibLayer.classList.add('hidden');
  btnPerm.style.display = 'block';
  modeEl.textContent = '请点击"开启体感识别"授权';
  btnPerm.addEventListener('click', function(){
   DeviceOrientationEvent.requestPermission().then(function(state){
    if(state === 'granted'){ startListening(); }
    else {
     modeEl.textContent = '已拒绝授权，使用下方按钮手动切换';
     btnPerm.style.display = 'none';
     showToast('未授权体感传感器，可以用下方按钮手动切换');
    }
   }).catch(function(){
    modeEl.textContent = '授权请求失败，使用下方按钮手动切换';
    btnPerm.style.display = 'none';
   });
  });
 } else {
  startListening();
 }
}

initSensor();
</script>
